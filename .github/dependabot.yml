version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    versioning-strategy: "lockfile-only"
    allow:
      - dependency-type: "direct"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"             # location of Dockerfile(s)
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/bootstrap/source"
    schedule:
      interval: "weekly"
      day: "tuesday"
    # Match bump.sh's 14-day cooldown, so a proposed bump is one bump.sh would also accept
    cooldown:
      default-days: 14
  # # TODO: Uncomment when pre-commit checks support cooldowns
  # - package-ecosystem: "pre-commit"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #     day: "tuesday"
