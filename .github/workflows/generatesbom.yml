name: Generate SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  generate-sbom:
    # Only runs on push to main / dispatch, so always trusted - use our runner.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.alpine
          push: false
          load: true
          tags: tooling-trusted-release:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check SBOM toolchain spec parity
        run: |
          docker run --rm tooling-trusted-release:latest \
            .venv/bin/python scripts/ci/check_sbom_spec_parity.py --require-tools

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: tooling-trusted-release:latest
          format: cyclonedx-json
          output-file: atr.cdx.json
