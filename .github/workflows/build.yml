name: Build and test

on:
  push:
    branches: [altera, arm, main, sbp, tertia]
  pull_request:
    branches: [arm, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: '0.11.20'

jobs:
  # Skip the build if this commit already passed on another branch.
  dedup:
    uses: ./.github/workflows/dedup.yml
    permissions:
      actions: read
    with:
      workflow_file: build.yml

  test:
    needs: dedup
    permissions:
      contents: read
      issues: write
    # Run on our own runner for trusted sources (push/dispatch, or a same-repo
    # PR); fork PRs fall back to the hosted runner so they never touch it.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}
    # Skip if this commit already built elsewhere, and keep skipping same-repo
    # PRs from branches push already built. Manual dispatch always runs so we
    # can force a rebuild.
    if: >-
      (needs.dedup.outputs.already_built != 'true' || github.event_name == 'workflow_dispatch') &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        !contains(fromJSON('["altera", "arm", "main", "sbp", "tertia"]'), github.event.pull_request.head.ref)
      )
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.14'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: apache/tooling-actions
          ref: main
          path: tooling-actions
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev --group test

      - name: Run unit tests
        run: |
          uv run --frozen pytest -rs tests

      - name: Run actions contract tests
        id: actions-contract
        continue-on-error: true
        run: |
          TOOLING_ACTIONS_PATH="$GITHUB_WORKSPACE/tooling-actions" uv run --frozen pytest -rs tests/contract

      - name: Open an issue on new actions breakage
        if: >-
          steps.actions-contract.outcome == 'failure' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          title="tooling-actions HEAD broke against server [${BRANCH}]"
          existing=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/issues?state=open&labels=actions-contract&per_page=100")
          if printf '%s' "$existing" | grep -Fq "\"${title}\""; then
            echo "An open actions-contract issue already exists for ${BRANCH}; doing nothing."
            exit 0
          fi
          body="The actions (apache/tooling-actions at HEAD) failed the contract check against server branch ${BRANCH} at commit ${SHA}. Run: ${RUN_URL} (cc @${ACTOR})"
          data=$(printf '{"title":"%s","body":"%s","labels":["actions-contract"]}' "$title" "$body")
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/issues" -d "$data" >/dev/null

      - name: Build image and check SBOM spec parity
        run: |
          docker build -f Dockerfile.alpine -t atr:ci .
          docker run --rm atr:ci .venv/bin/python scripts/ci/check_sbom_spec_parity.py --require-tools

      - name: Check that the server runs as a non-root user
        env:
          NRSRV: atr-ci-nonroot-${{ github.run_id }}
          NRVOL: atr-ci-nonroot-state-${{ github.run_id }}
          NRNEG: atr-ci-nonroot-denied-${{ github.run_id }}
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            if [ "$status" != "0" ]
            then
              docker logs "$NRSRV" --tail 100 || true
            fi
            docker rm -f "$NRSRV" "$NRNEG" >/dev/null 2>&1 || true
            docker volume rm -f "$NRVOL" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          test "$(docker image inspect atr:ci --format '{{.Config.User}}')" = "1000:1000"
          test "$(docker run --rm atr:ci id -u)" = "1000"
          docker volume create "$NRVOL"
          docker run --rm --user 0:0 -v "$NRVOL:/opt/atr/state" atr:ci chown 1000:1000 /opt/atr/state
          docker run -d --name "$NRSRV" --user 1000:1000 \
            -v "$NRVOL:/opt/atr/state" \
            -e TESTS=1 \
            -e APP_HOST=localhost.apache.org:8080 \
            -e BIND=0.0.0.0:8080 \
            -e SSH_HOST=0.0.0.0 \
            atr:ci
          for _ in $(seq 1 60); do
            docker exec "$NRSRV" curl -ksf https://127.0.0.1:8080/ >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec "$NRSRV" curl -ksf https://127.0.0.1:8080/ >/dev/null
          test "$(docker exec "$NRSRV" stat -c '%u' /proc/1)" = "1000"
          if timeout 60 docker run --rm --name "$NRNEG" --user 12321:12321 \
            -e TESTS=1 \
            -e APP_HOST=localhost.apache.org:8080 \
            -e BIND=0.0.0.0:8080 \
            -e SSH_HOST=0.0.0.0 \
            atr:ci > denied.txt 2>&1
          then
            echo "Expected startup to fail without a writable state directory"
            exit 1
          fi
          grep -q "not writable" denied.txt

      - name: Run Playwright end-to-end tests
        run: |
          sh tests/run-playwright.sh
