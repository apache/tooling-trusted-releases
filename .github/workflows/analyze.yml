name: Analyze using pre-commit hooks

on:
  push:
    branches: [altera, arm, main, sbp, tertia]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: '0.13.5'
  BIOME_VERSION: '2.3.8'

jobs:
  # Skip the analysis if this commit already passed on another branch.
  dedup:
    uses: $/.github/workflows/dedup.yml
    permissions:
      actions: read
    with:
      workflow_file: analyze.yml

  analyze:
    needs: dedup
    # Manual dispatch always runs so we can force a re-analysis.
    if: needs.dedup.outputs.already_built != 'true' || github.event_name == 'workflow_dispatch'
    # Trusted sources on our own runner; fork PRs on the hosted runner.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: ${{ env.BIOME_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Cache prek data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-1|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Show pip version
        run: |
          pip --version
          python -m pip --version
          pip3 --version
          python3 -m pip --version
          uv run --frozen pip --version

      - name: Run prek
        run: |
          uv run --frozen prek run --show-diff-on-failure --color=always --all-files

      - name: Run prek on each pushed commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          # Vulnerability audits are time-dependent and already run against the
          # pushed tip above. A later commit in a push may fix an earlier one.
          SKIP: pip-audit,uv-audit
        run: |
          if ! git rev-parse --verify --quiet "${BEFORE}^{commit}" > /dev/null; then
            echo "WARNING: previous tip ${BEFORE} is unavailable, skipping per-commit checks for this push"
            exit 0
          fi
          for commit in $(git rev-list --reverse --no-merges "${BEFORE}..HEAD"); do
            echo "::group::pre-commit at ${commit}"
            git checkout --quiet "${commit}"
            uv run --frozen prek run --show-diff-on-failure --color=always --from-ref "${commit}^" --to-ref "${commit}"
            echo "::endgroup::"
          done
          git checkout --quiet "${GITHUB_SHA}"
