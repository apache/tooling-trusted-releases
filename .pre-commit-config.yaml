exclude: ^node_modules/
repos:
- repo: meta
  hooks:
    - id: check-hooks-apply
      name: check that hooks apply
      description: check that all the hooks apply to the repository
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
    - id: check-ast
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-illegal-windows-names
    - id: check-json
    - id: check-merge-conflict
    - id: check-shebang-scripts-are-executable
    - id: check-toml
    - id: check-vcs-permalinks
    - id: check-yaml
    - id: detect-private-key
    - id: end-of-file-fixer
      exclude: ^atr/static/js/(ts|min)/|\.map$
    - id: fix-byte-order-marker
    - id: forbid-submodules
    - id: mixed-line-ending
    - id: trailing-whitespace
      exclude: ^atr/static/js/(ts|min)/
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: ad1b27d73581aa16cca06fc4a0761fc563ffe8e8  # frozen: v1.5.6
  hooks:
    - id: insert-license
      name: add a license for all Python files
      files: ^(atr|scripts|tests)/(.*\.py$|.*\.pyi)$
      args:
        - --comment-style
        - "|#|"
        - --license-filepath
        - scripts/ci/LICENSE-template.txt
        - --fuzzy-match-generates-todo
    - id: insert-license
      name: add a license for JS and TS files
      files: ^atr/static/(js/src/.*\.js|ts/.*\.ts)$
      args:
        - --comment-style
        - "/*| * |*/"
        - --license-filepath
        - scripts/ci/LICENSE-template.txt
        - --fuzzy-match-generates-todo
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
  hooks:
    - id: markdownlint
      name: run Markdown lints
      description: check Markdown files with markdownlint
      args: [--config=.github/linters/.markdown-lint.yml]
      types: [markdown]
      files: \.md$
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
  hooks:
    - id: shellcheck
- repo: https://github.com/rtts/djhtml
  rev: 8577ec017145d76a0b954ebb7cb3169d4303014c  # frozen: 3.0.11
  hooks:
    - id: djhtml
      files: .*/.*\.html$
    - id: djcss
      files: .*/atr.css$
