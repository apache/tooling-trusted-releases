- repo: local
  hooks:
    - id: ruff
      name: lint Python files with Ruff
      entry: uv run --frozen ruff check --fix
      language: system
      types: [python]

    - id: ruff-format
      name: format Python files with Ruff
      entry: uv run --frozen ruff format --force-exclude
      language: system
      types: [python]

    - id: biome-format
      # Install biome from https://biomejs.dev/guides/manual-installation/
      # Avoid using NPM to install it until #359 is resolved
      name: format JS files with Biome
      entry: biome format --write --files-ignore-unknown=true --no-errors-on-unmatched --colors=off
      language: system
      types: [javascript]
      files: ^atr/static/js/src/.*\.js$

    - id: biome-check
      # Install biome from https://biomejs.dev/guides/manual-installation/
      # Avoid using NPM to install it until #359 is resolved
      name: lint JS files with Biome
      entry: biome check --write --error-on-warnings --files-ignore-unknown=true --no-errors-on-unmatched --colors=off
      language: system
      types: [javascript]
      files: ^atr/static/js/src/.*\.js$

    - id: pyright
      name: type check Python files with Pyright
      entry: uv run --frozen pyright
      language: system
      require_serial: true
      types: [python]
      exclude: ^tests/

    - id: jinja-route-check
      name: check Jinja2 routes
      description: Check whether routes used in Jinja2 templates actually exist
      entry: uv run --frozen python scripts/lint/jinja_route_checker.py
      language: system
      pass_filenames: false
      always_run: true

    - id: check-when-dependencies-updated
      name: check when dependencies were updated
      description: Verify that dependencies were updated within the configured timeframe, for ASVS 15.1.1
      entry: uv run --frozen python scripts/check_when_dependencies_updated.py
      language: system
      pass_filenames: false
      always_run: true

    - id: check-npm-dependencies-updated
      name: check when npm dependencies were updated
      description: Verify that npm dependencies were updated within the configured timeframe, for ASVS 15.1.1
      entry: uv run --frozen python scripts/check_npm_dependencies_updated.py
      language: system
      pass_filenames: false
      always_run: true

    - id: uv-audit
      name: audit dependencies with uv
      description: Check uv.lock for known vulnerabilities via OSV, trialled alongside pip-audit
      entry: uv audit --frozen --preview-features audit-command
      language: system
      pass_filenames: false
      always_run: true

    - id: check-pth-files
      name: check .pth files in the venv
      description: Refuse unknown .pth files in .venv; Python runs their import lines at interpreter startup, so they are a supply-chain attack vector
      entry: python3 -S scripts/check_pth_files.py
      language: system
      pass_filenames: false
      always_run: true

    - id: check-models-imports
      name: check models imports
      description: Ensure that the models only import from approved packages
      entry: uv run --frozen python scripts/check_models_imports.py
      language: system
      pass_filenames: false
      files: ^atr/models/.*\.py$

    - id: check-nullable-fields
      name: check SQL model nullability
      description: Ensure non-optional SQLModel fields declare nullable=False
      entry: uv run --frozen python scripts/check_nullable_fields.py
      language: system
      files: ^atr/models/sql\.py$

    - id: check-migrations-immutable
      name: check migration immutability
      description: Refuse to modify, rename, or delete an existing migrations/versions/ file, because shipped migrations are append only
      entry: uv run --frozen python scripts/check_migrations_immutable.py
      language: system
      pass_filenames: false
      always_run: true

    - id: template-usage-linter
      name: check template usage
      description: Ensure that all templates are used and available w/o duplicates
      entry: uv run --frozen python scripts/check_templates.py atr
      language: system
      pass_filenames: false

    - id: docs
      name: build and check documentation
      entry: make docs
      language: system
      pass_filenames: false
      always_run: true
