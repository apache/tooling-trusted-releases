- repo: https://github.com/thibaudcolas/pre-commit-stylelint
  rev: a43d64a23287d2dc2e02289bd3b2cb0da5eddfb1  # frozen: v17.16.0
  hooks:
    - id: stylelint
      additional_dependencies: ['stylelint@16.14.1', 'stylelint-config-standard@37.0.0']
      files: "atr/static/css/.*\\.css$"
      types_or: ['css']
      args: ['--fix', '--allow-empty-input']
- repo: https://github.com/woodruffw/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
  hooks:
    - id: zizmor
      args: [--min-severity, low]
- repo: https://github.com/pypa/pip-audit
  rev: 8894eb8cee033531a1fbd9f2fb160892531c14e3  # frozen: v2.10.1
  hooks:
    - id: pip-audit
      args:
        - '-r'
        - 'pip-audit.requirements'
        - '--disable-pip'
        - '--no-deps'
        - '--ignore-vuln'
        - 'PYSEC-2025-183'
- repo: https://github.com/oxc-project/mirrors-oxlint
  rev: 644689fa1b7bb5f57cade8e8869fae6d8fcfc1f0  # frozen: v1.60.0
  hooks:
    - id: oxlint
      name: lint JS files with Oxlint
      types: [javascript]
      files: ^atr/static/js/src/.*\.js$
      args:
        # These must be in the order deny, warn, allow
        - --deny=correctness
        - --deny=perf
        - --deny=suspicious
        - --deny=pedantic
        - --allow=unicorn/prefer-query-selector
