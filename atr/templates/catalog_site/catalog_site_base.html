<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="description"
          content="{%- block description -%}{%- endblock description -%}" />
    <title>{%- block title -%}{%- endblock title -%}</title>

    <link rel="icon"
          type="image/x-icon"
          href="https://apache.org/favicons/favicon.ico" />
    <link rel="stylesheet" href="{{ root }}assets/css/normalize.css" />
    <link rel="stylesheet" href="{{ root }}assets/css/atr.css" />
    <link rel="stylesheet" href="{{ root }}assets/css/bootstrap.custom.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-light bg-info-light navbar-ribbon" aria-label="Release catalog">
      <div class="container-fluid">
        <a class="navbar-atr" href="{{ root }}index.html">
          <img src="{{ root }}assets/svg/atr_logo.svg"
               alt="The Apache Software Foundation"
               class="asf-logo" />
        </a>
        <span class="navbar-text ms-3 me-auto fw-semibold">ASF Release catalog</span>
      </div>
    </nav>

    <main class="container py-4 flex-grow-1">
      {% block content %}{% endblock content %}
      <p class="text-muted small mt-4 mb-0">Last updated {{ last_updated() }}.</p>
    </main>

    {% include "includes/footer.html" %}
    {% block scripts %}{% endblock scripts %}
  </body>
</html>
