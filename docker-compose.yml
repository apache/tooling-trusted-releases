services:
  atr:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    user: "${ATR_UID:-0}:${ATR_GID:-0}"
    environment:
      - TESTS=1
      - APP_HOST=atr:8080
      - BIND=0.0.0.0:8080
      - SSH_HOST=0.0.0.0
      - LDAP_BIND_DN=$LDAP_BIND_DN
      - LDAP_BIND_PASSWORD=$LDAP_BIND_PASSWORD
    networks:
      - atr-network
    volumes:
      - ./state:/opt/atr/state
      - ./atr:/opt/atr/atr
      - ./start-dev.sh:/opt/atr/start-atr.sh
    ports:
      - 8080:8080
    init: true
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://127.0.0.1:8080/"]
      interval: 30s
      timeout: 1s
      retries: 30
      start_period: 10s
      start_interval: 2s

networks:
  atr-network:
    driver: bridge
